name: CI Pipeline

on:
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Strict Typecheck
        run: npm run typecheck

      - name: Lint Codebase
        run: npm run lint

      - name: Run Vitest Suite
        run: npm run test

      - name: Build Next.js Bundle
        run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/lawguide"
          NEXTAUTH_SECRET: "ci_dummy_secret"
          NEXTAUTH_URL: "http://localhost:3000"
          GEMINI_API_KEY: "ci_dummy_key"
          PINECONE_API_KEY: "ci_dummy_key"
          REDIS_URL: "redis://localhost:6379"
          SENTRY_DSN: "http://dummy@sentry.io/1"

  docker-build-check:
    name: Validate Docker Build
    runs-on: ubuntu-latest
    needs: test-and-build
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Build Docker Image
        run: docker build -t lawguide-ai:ci-test .
