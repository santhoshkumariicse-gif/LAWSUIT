version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: lawguide-ai:production
    container_name: lawguide_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
      - db
    networks:
      - lawguide-network

  redis:
    image: redis:7-alpine
    container_name: lawguide_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - lawguide-network

  db:
    image: postgres:15-alpine
    container_name: lawguide_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: lawguide
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - lawguide-network

volumes:
  redis_data:
  pg_data:

networks:
  lawguide-network:
    driver: bridge
